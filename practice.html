<section>
<h2>اليوم 1: من التعثر إلى الدليل</h2>
<ol>
<li><p>مشروع صور تقدم الأعمال في إدارة التطوير: التقدير من الصور ضمن 5 نقاط من تقدير المهندس في 46 زيارة من 50، ويظهر في لوحة المشروعات. مستخلصات المقاولين ما زالت تُصرف بتقرير يكتبه المقاول، والعقد لم يُعدَّل. يقول المقاولون: «لا نثق بالنموذج». ما السبب الرئيسي بقاعدة الأسبقية؟</p><ul><li><b>أ.</b> التقييم، لأن ثقة المقاولين بالنموذج لم تُقَس</li><li><b>ب.</b> التكامل، فالتقدير لا يصل إلى نظام الصرف</li><li><b>ج.</b> العمليات التي لم تتغير، فالعقد والصرف كما هما</li><li><b>د.</b> البيانات، فالصور قد لا تكون كافية لكل المشروعات</li></ul></li>
<li><p>مساعد أسئلة الموظفين: 19 من 20 في العرض، و28 من 40 على الأسئلة الحقيقية؛ بالعربية 15 من 24، وبالإنجليزية 13 من 16، وإخفاق حرج واحد عن إجازة مرضية. أي جملة تصف النتيجة بأمانة؟</p><ul><li><b>أ.</b> 70% على الحقيقية مقابل 95% في العرض، وأضعف بالعربية، مع إخفاق حرج</li><li><b>ب.</b> 47 من 60 حالة ناجحة في المجموعتين معًا، أي 78% تقريبًا</li><li><b>ج.</b> 70% على الأسئلة الحقيقية، والفرق بين العربية والإنجليزية صغير لا يُذكر</li><li><b>د.</b> 70% على الأسئلة الحقيقية، والإخفاق الحرج حالة واحدة فلا يغيّر الصورة</li></ul></li>
<li><p>مصدر مطلوب لمشروع صور تقدم الأعمال: جدول المشروع، اكتماله 97% وتكراره 1% وصلاحيته 98%، مصنف «مقيد» والاعتماد مطلوب، وأصله موثق، ويتحدث آليًّا كل يوم كما يلزم، ويقرؤه النظام بحساب مهندس المشروع. ما البند المعيق فيه؟</p><ul><li><b>أ.</b> التصنيف، لأن الاعتماد لم يصدر بعد</li><li><b>ب.</b> الجودة، لأن الاكتمال لم يبلغ مائة في المائة</li><li><b>ج.</b> التحديث، لأن الجدول لا يتجدد لحظيًّا</li><li><b>د.</b> الوصول بحساب مهندس، ولو كان ممنوحًا</li></ul></li>
<li><p>مشروع مطابقة فواتير المورِّدين في إدارة المالية: صحة 96% على 500 فاتورة من سجل 2025 الحقيقي، والنتيجة تُكتب في حقل داخل النظام المالي. إجراء الصرف ما زال يطلب توقيعين يدويين على كل فاتورة، فلم يتغير زمن الصرف. ما السبب الرئيسي بقاعدة الأسبقية؟</p><ul><li><b>أ.</b> التقييم، فخمسمائة فاتورة لا تكفي للحكم على النموذج</li><li><b>ب.</b> التكامل، فالنتيجة لا تصل إلى من يصرف</li><li><b>ج.</b> العمليات التي لم تتغير، فإجراء الصرف كما كان</li><li><b>د.</b> البيانات، فسجل 2025 قد لا يشبه فواتير 2026</li></ul></li>
<li><p>مساعد توجيه بلاغات الدعم الفني: بناه مختبر الابتكار، وانتهت التجربة في مايو، ولم توقّع إدارة تقنية المعلومات على استلامه ولا بند لتشغيله في موازنتها. تغيرت فئات البلاغات في مارس ولم يُحدَّث المساعد. ما السبب الرئيسي؟</p><ul><li><b>أ.</b> البيانات، لأن الفئات تغيرت ولم تُحدَّث</li><li><b>ب.</b> الملكية، فلا أحد يستلمه أو يموّل تشغيله</li><li><b>ج.</b> التقييم، لأن أحدًا لم يقس أثر تغيير الفئات على الدقة</li><li><b>د.</b> اختيار المشكلة، فتوجيه البلاغات لا يحتاج ذكاءً اصطناعيًّا</li></ul></li>
<li><p>مشروع فرز السير الذاتية في الموارد البشرية: صحته 91% على 400 سيرة حقيقية، ويعرض النتيجة في نظام التوظيف. لكن الفرز بقاعدة المؤهل والخبرة يعمل اليوم في ثلاث دقائق لكل وظيفة بلا شكاوى، ولا مشكلة مكتوبة في ميثاق المشروع، والقرار يمس المتقدمين. ما السبب الرئيسي؟</p><ul><li><b>أ.</b> التقييم، فـ400 سيرة لا تمثل كل الوظائف ولا كل المتقدمين</li><li><b>ب.</b> التكامل، فالنتيجة لا تُكتب في ملف المتقدم</li><li><b>ج.</b> الملكية، فالموارد البشرية لم تطلب المشروع</li><li><b>د.</b> اختيار المشكلة، فحل أبسط يعمل ولا مشكلة مكتوبة</li></ul></li>
<li><p>جملة يقولها مدير في اجتماع، مثل «الموظفون لا يثقون بالنموذج»، تكفي وحدها دليلًا على السبب الرئيسي لتعثر المشروع.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في ملاحظات مشروع للتنبؤ بالطلب على قطع الغيار، أي سطر واقعة تصلح دليلًا على سبب؟</p><ul><li><b>أ.</b> «فريق المستودع لا يحب الأدوات الجديدة، ويفضل جداوله القديمة»</li><li><b>ب.</b> «النموذج على الأرجح لا يفهم موسم الصيف»</li><li><b>ج.</b> أمر الشراء يُصدر بكميات العقد الثابتة، والعقد لم يُعدَّل</li><li><b>د.</b> «البيانات تبدو غير مرتبة، وفيها أعمدة لا يعرف أحد معناها»</li></ul></li>
<li><p>لماذا ترتفع نسبة النجاح في العرض التوضيحي عادة عن نسبتها على حالات العمل الحقيقية؟</p><ul><li><b>أ.</b> لأن حالاته مختارة لتنجح، نظيفة وكاملة</li><li><b>ب.</b> لأن النموذج يتعلم من كل حالة أثناء العرض فيتحسن قبل نهايته</li><li><b>ج.</b> لأن العرض يُشغَّل على نموذج أكبر</li><li><b>د.</b> لأن الحالات الحقيقية تُصحَّح بقاعدة أشد</li></ul></li>
<li><p>مساعد توجيه بلاغات الدعم الفني: 24 من 25 في العرض، و33 من 50 على بلاغات حقيقية؛ بالعربية 15 من 30، وبالإنجليزية 18 من 20. أي جملة للجنة أمينة؟</p><ul><li><b>أ.</b> 66% على البلاغات الحقيقية مقابل 96% في العرض، والعربية 50% والإنجليزية 90%</li><li><b>ب.</b> 57 من 75 بلاغًا ناجحًا في المجموعتين، أي 76%</li><li><b>ج.</b> 96% في العرض، وهو الرقم الذي جرّبه المورِّد بنفسه</li><li><b>د.</b> 66% على البلاغات الحقيقية، وهي قريبة من هدف 70%</li></ul></li>
<li><p>بلاغ دعم فني فيه أربعة حقول متوقعة. أصاب النظام الفئة والأولوية ولغة الرد، وكتب رقم جهاز لم يذكره البلاغ. كيف يُعدّ بقاعدة الحالة؟</p><ul><li><b>أ.</b> ناجح بنسبة 75%</li><li><b>ب.</b> ناجح، لأن الأولوية صحيحة</li><li><b>ج.</b> فاشل، فرقم الجهاز مختلَق</li><li><b>د.</b> لا يُعدّ، لأن البلاغ ناقص</li></ul></li>
<li><p>إذا بدت قاعدة النجاح صارمة بعد رؤية النتائج، يجوز تخفيفها قبل كتابة التقرير للجنة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>نتيجة إعادة اختبار مساعد للعملاء: 80% إجمالًا، وبالعربية 60% وبالإنجليزية 95%. بقاعدة هذا المقرر عن الفجوة بين اللغتين، ماذا يحدث للبوابة؟</p><ul><li><b>أ.</b> تعبر، لأن النسبة الكلية 80%</li><li><b>ب.</b> تعبر إن وافق مالك المسار على الفجوة كتابة</li><li><b>ج.</b> يُعاد الاختبار على الحالات الإنجليزية وحدها</li><li><b>د.</b> لا تعبر، فالفجوة متركزة في مجموعة واحدة</li></ul></li>
<li><p>مصدر بيانات: الاكتمال 93%، والتكرار 3%، والصلاحية 96%. بدليل التقدير في المقرر (2: 95 / 2 / 95؛ 1: 85 / 5 / 90)، ما درجة الجودة؟</p><ul><li><b>أ.</b> 2</li><li><b>ب.</b> 1</li><li><b>ج.</b> 0، وهو بند معيق</li><li><b>د.</b> لا تُحسب حتى تُعرف الدقة</li></ul></li>
<li><p>نظام في التجربة يقرأ سجل المورِّدين بحساب محاسب في المالية، ونجح الوصول طوال التجربة. لماذا يعدّه دليل التقدير بندًا معيقًا؟</p><ul><li><b>أ.</b> لأن المحاسب قد يرفض مشاركة حسابه</li><li><b>ب.</b> لأن حساب الموظف لا يعمل خارج ساعات الدوام</li><li><b>ج.</b> لأن سجل المورِّدين مصنف «سري»، ولا يُسمح لأي نظام آلي بقراءة السري</li><li><b>د.</b> لأن الإنتاج يحتاج هوية للنظام نفسه وسجلًّا يميز ما فعله</li></ul></li>
<li><p>مصدر مطلوب للإنتاج مصنف «مقيد»، ولم يُطلب اعتماد استعماله لهذا النظام. في رَدهة، من يفك هذا البند؟</p><ul><li><b>أ.</b> فريق التقنية بمنح صلاحية قراءة</li><li><b>ب.</b> مالك المصدر يطلب، ومسؤولة حوكمة البيانات تعتمد</li><li><b>ج.</b> مالك المسار يعتمد طلبه بنفسه</li><li><b>د.</b> المورِّد، بتوقيع اتفاقية سرية تغطي كل بيانات المستأجرين</li></ul></li>
<li><p>مساعد تكلفته الثابتة 4,000 ريال في الشهر، و0.10 ريال للنموذج لكل إجابة. كم تكلفة الإجابة الواحدة عند 200 إجابة في الشهر، وعند 5,000؟</p><ul><li><b>أ.</b> 20.10 ثم 0.90 ريال</li><li><b>ب.</b> 20.10 ريال في الحالتين</li><li><b>ج.</b> 0.10 ثم 0.90 ريال</li><li><b>د.</b> 0.10 ريال في الحالتين</li></ul></li>
<li><p>المشروع أ: درجة جاهزية 72% وثلاثة بنود معيقة. المشروع ب: 64% ولا بند معيقًا. أيهما أقرب إلى الإنتاج من حيث البيانات؟</p><ul><li><b>أ.</b> ب، لأن لا شيء يمنع إنتاجه من حيث البيانات</li><li><b>ب.</b> أ، لأن درجته أعلى</li><li><b>ج.</b> متساويان، فالفرق ثماني نقاط فقط</li><li><b>د.</b> لا يُحكم حتى تُعرف التكلفة لكل مهمة ناجحة في المشروعين</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: نموذج التشغيل والبوابات</h2>
<ol>
<li><p>مساعد لأسئلة مستأجري المكاتب في إدارة التأجير التجاري: 23 من 25 في عرض المورِّد، و31 من 45 على أسئلة حقيقية، والنتيجة غير مقسومة باللغة. ما الذي ينقص قبل أن تقرأه اللجنة؟</p><ul><li><b>أ.</b> أن يُضاف رقم العرض إلى الرقم الواقعي ليُقرأ الأداء في نسبة واحدة</li><li><b>ب.</b> إعادة العرض أمام اللجنة على حالات جديدة يختارها المورِّد</li><li><b>ج.</b> تقسيم النتيجة بين العربية والإنجليزية، وعدد الإخفاقات الحرجة</li><li><b>د.</b> زيادة المجموعة إلى مائة حالة قبل أي تقرير</li></ul></li>
<li><p>شركة نقل من 2,500 موظف: سبع إدارات تعمل بالذكاء الاصطناعي، وفي كل منها فريق بيانات ناضج، ولا فريق بناء في المركز، ومشروعاتها كلها على بيانات تشغيلية «عام» لا تمس الناس. ماذا يقترح دليل المقارنة؟</p><ul><li><b>أ.</b> مركزي، فالمعايير الموحدة أهم من السرعة</li><li><b>ب.</b> اتحادي، فالمهارات في كل إدارة</li><li><b>ج.</b> محوري، لأن عدد الإدارات كبير</li><li><b>د.</b> لا يُحكم قبل جمع خمس إشارات أخرى</li></ul></li>
<li><p>مشروع مطابقة الفواتير: النجاح على المجموعة الواقعية 94%، والعربية والإنجليزية متقاربتان، ولا إخفاق حرج؛ المستوى متوسط واعتمده رئيس مكتب التوسع؛ التكلفة لكل فاتورة ناجحة أدنى من خط الأساس. لكن النظام لا يكتب في النظام المالي بعد، والموظفون ينسخون. ما القرار؟</p><ul><li><b>أ.</b> توسع، فثلاث بوابات من أربع عبرت</li><li><b>ب.</b> انتظار رأي المستخدمين بعد ستة أشهر أخرى</li><li><b>ج.</b> توقف، فقاعدة التوقف تُطبَّق حين لا تعبر أي بوابة</li><li><b>د.</b> إصلاح الكتابة في النظام المالي، ثم إعادة القياس</li></ul></li>
<li><p>شركة من 250 موظفًا فيها ثلاثة أشخاص بمهارات الذكاء الاصطناعي، وإدارة واحدة تستعمله، ومشروعاتها تمس بيانات العملاء المالية. أي نموذج تشغيل يناسبها الآن؟</p><ul><li><b>أ.</b> مركزي: فريق واحد يبني ويحكم</li><li><b>ب.</b> اتحادي: كل إدارة تبني لنفسها</li><li><b>ج.</b> محوري بأطراف في كل الإدارات</li><li><b>د.</b> لا نموذج حتى تكبر</li></ul></li>
<li><p>مجموعة كبيرة لكل شركة فيها فريق بيانات ناضج، ومشروعاتها منخفضة المخاطر، وأولويتها السرعة. أي نموذج تشغيل أقرب؟</p><ul><li><b>أ.</b> مركزي</li><li><b>ب.</b> محوري</li><li><b>ج.</b> لا يهم النموذج</li><li><b>د.</b> اتحادي</li></ul></li>
<li><p>ما الذي يميز النموذج المحوري (المحور والأطراف)؟</p><ul><li><b>أ.</b> منصة ومعايير وحوكمة في المركز، والبناء والتسليم في الإدارات</li><li><b>ب.</b> كل إدارة تشتري أدواتها وتبني وتحكم نفسها، بلا منصة مشتركة ولا معايير</li><li><b>ج.</b> فريق مركزي يبني كل شيء، والإدارات تستلم</li><li><b>د.</b> لجنة واحدة تعتمد كل مشروع ولا فريق في المركز</li></ul></li>
<li><p>مدير إدارة المالية هو مالك مسار لمشروع، ويطلب استثناءً لإدخال بيانات «مقيد» إلى نموذج مستضاف. في جدول صلاحيات القرار، من يعتمد الاستثناء؟</p><ul><li><b>أ.</b> مدير المالية نفسه، فهو مالك المسار ويعرف البيانات أكثر من غيره</li><li><b>ب.</b> فريق المنصة الذي سينفذ</li><li><b>ج.</b> المورِّد</li><li><b>د.</b> مسؤولة حوكمة البيانات، لا مقدم الطلب</li></ul></li>
<li><p>في عملية فواتير بعد النموذج، ينسخ موظف رقم المورِّد من شاشة النموذج إلى النظام المالي، ثم يطبع الفاتورة ليوقعها مديره. ما الذي تزيله إعادة تصميم العملية أولًا؟</p><ul><li><b>أ.</b> النموذج، فهو يضيف خطوة</li><li><b>ب.</b> النسخ اليدوي والتوقيع المطبوع: حلول التفافية حول النظام</li><li><b>ج.</b> المدير، فلا حاجة إلى موافقة بعد أن يتحقق النموذج من الفاتورة</li><li><b>د.</b> لا شيء، فالدقة عالية والموظفون اعتادوا الخطوات الحالية</li></ul></li>
<li><p>بطريقة الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي: خطر احتماليته 2 وأثره 4. ما مستواه؟</p><ul><li><b>أ.</b> منخفض (6)</li><li><b>ب.</b> متوسط (6)</li><li><b>ج.</b> مرتفع (8)</li><li><b>د.</b> كارثي (8)</li></ul></li>
<li><p>مساعد أسئلة الموظفين: التكلفة لكل إجابة ناجحة 4.93 ريال عند نجاح 70%، وخط الأساس اليدوي 8.00 ريال. بالعربية 62.5% وبالإنجليزية 81.3%. ماذا تقول البوابات؟</p><ul><li><b>أ.</b> تعبر كلها، فالتكلفة لكل إجابة ناجحة أدنى من خط الأساس اليدوي</li><li><b>ب.</b> تعبر بوابة التكلفة، ولا تعبر بوابة التقييم بسبب فجوة اللغة</li><li><b>ج.</b> لا تعبر بوابة التكلفة، لأن 70% دون الهدف</li><li><b>د.</b> لا يُحكم على التكلفة قبل التقييم</li></ul></li>
<li><p>أي جملة تصلح قاعدة توقف لمشروع في خطة التوسع؟</p><ul><li><b>أ.</b> نتوقف إذا رأت اللجنة في اجتماعها القادم أن المشروع لم يعد يناسب أولوياتها</li><li><b>ب.</b> نتوقف عند أول شكوى مكتوبة من مستخدم عن خطأ في نتيجة النظام، أيًّا كان نوع الخطأ وأثره</li><li><b>ج.</b> نراجع استمرار المشروع أو إيقافه حين تسمح موازنة العام القادم بذلك</li><li><b>د.</b> نوقفه إن بقي النجاح الواقعي دون الحد المكتوب في إعادتي اختبار متتاليتين، ويقرر المالك</li></ul></li>
<li><p>حدود بوابات التوسع وقاعدة التوقف تُكتب قبل أن تُعرف نتائج إعادة الاختبار.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مالك مسار يقدّر أثر خطر في مشروعه بـ 1 بدل 3، فيصير المستوى منخفضًا، ثم يعتمد المشروع بنفسه بمسار الخطر المنخفض. ما الخلل الأول؟</p><ul><li><b>أ.</b> أنه ضرب الاحتمالية في الأثر بدل أن يجمعهما</li><li><b>ب.</b> أن مسار الخطر المنخفض يجب أن تعتمده لجنة الاستثمار</li><li><b>ج.</b> أنه قدّر الخطر واعتمد طلبه بنفسه</li><li><b>د.</b> أن الاحتمالية لم تُذكر</li></ul></li>
